plan_name: adds dtypes to the columns required for the conversion
conversion_type: set_column_dtypes
column: PlaceHolder
focus_column: PlaceHolder
conversion_args:
    dtype_args:
        # Core identifier columns
        -   column_name: line_item_id
            dtype: string
        # Billing period columns
        -   column_name: bill_BillingPeriodStartDate
            dtype: string
        -   column_name: bill_BillingPeriodEndDate
            dtype: string
        # Account columns
        -   column_name: bill_PayerAccountId
            dtype: string
        -   column_name: lineItem_UsageAccountId
            dtype: string
        # Usage period columns
        -   column_name: lineItem_UsageStartDate
            dtype: string
        -   column_name: lineItem_UsageEndDate
            dtype: string
        # Product columns
        -   column_name: product_ProductName
            dtype: string
        -   column_name: product_ProductFamily
            dtype: string
        # Line item type for charge category mapping
        -   column_name: lineItem_LineItemType
            dtype: string
        # Cost columns
        -   column_name: lineItem_UnblendedCost
            dtype: float
        -   column_name: lineItem_UsageAmount
            dtype: float
        -   column_name: amortisedCost
            dtype: float
        # Currency column
        -   column_name: lineItem_CurrencyCode
            dtype: string
        # Location columns
        -   column_name: availabilityZone
            dtype: string
        -   column_name: region
            dtype: string
        # Resource columns
        -   column_name: resourceId
            dtype: string
        # Pricing column
        -   column_name: pricing_Unit
            dtype: string
        # Custom fields
        -   column_name: tags
            dtype: string
        -   column_name: updatedAt
            dtype: string